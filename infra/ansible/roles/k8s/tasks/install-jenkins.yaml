---
- name: Install Jenkins
  block:
    - name: Add jenkins chart repo
      kubernetes.core.helm_repository:
        name: jenkins
        repo_url: "https://charts.jenkins.io"

    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: "{{ jenkins_namespace }}"
        kind: Namespace
        state: present

    - name: Install ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'jenkins-sa.yaml.j2') | from_yaml_all }}"
        namespace: "{{ jenkins_namespace }}"

    - name: Install jenkins
      kubernetes.core.helm:
        name: jenkins
        chart_ref: jenkins/jenkins
        release_namespace: "{{ jenkins_namespace }}"
        values: "{{ lookup('template', 'jenkins-values.yaml.j2') | from_yaml }}"
